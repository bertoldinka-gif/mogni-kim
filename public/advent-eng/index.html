function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleDifferent(arr) {
  if (arr.length < 2) return arr;
  let s = shuffle(arr);
  for (let i = 0; i < 10 && s.join("|") === arr.join("|"); i++) s = shuffle(arr);
  return s;
}
function loadProgress(level) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY(level));
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter((n) => Number.isInteger(n) && n >= 1 && n <= 30) : [];
  } catch { return []; }
}
function saveProgress(level, days) {
  try { localStorage.setItem(STORAGE_KEY(level), JSON.stringify(days)); } catch {}
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/___/g, "blank"));
  u.lang = "en-US";
  u.rate = 0.9;
  const voice = window.speechSynthesis.getVoices().find((v) => v.lang === "en-US");
  if (voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}
function getCalendarInfo() {
  const now = new Date();
  const m = now.getMonth();
  const d = now.getDate();
  if (m === 11) return { openUpTo: Math.min(d, 30), today: d <= 30 ? d : null, daysUntil: 0 };
  if (m === 0) return { openUpTo: 30, today: null, daysUntil: 0 };
  const dec1 = new Date(now.getFullYear(), 11, 1);
  const daysUntil = Math.ceil((dec1 - new Date(now.getFullYear(), m, d)) / 86400000);
  return { openUpTo: 0, today: null, daysUntil };
}

/* ---------------- Jingle Bells synth (Web Audio API) ---------------- */
const FREQ = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99, A: 880.0, B: 987.77 };
const MELODY = [
  ["E",1],["E",1],["E",2], ["E",1],["E",1],["E",2], ["E",1],["G",1],["C",1.5],["D",0.5],["E",4],
  ["F",1],["F",1],["F",1.5],["F",0.5], ["F",1],["E",1],["E",1],["E",0.5],["E",0.5],
  ["E",1],["D",1],["D",1],["E",1], ["D",2],["G",2],
  ["E",1],["E",1],["E",2], ["E",1],["E",1],["E",2], ["E",1],["G",1],["C",1.5],["D",0.5],["E",4],
  ["F",1],["F",1],["F",1.5],["F",0.5], ["F",1],["E",1],["E",1],["E",0.5],["E",0.5],
  ["G",1],["G",1],["F",1],["D",1], ["C",4], [null,4],
];
const BEAT = 0.3;

function useJingleBells() {
  const ctxRef = useRef(null);
  const timerRef = useRef(null);
  const [playing, setPlaying] = useState(false);

  const scheduleLoop = useCallback((ctx, master, start) => {
    let t = start;
    for (const [note, beats] of MELODY) {
      const dur = beats * BEAT;
      if (note) {
        const osc = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc2.type = "triangle";
        osc.frequency.value = FREQ[note];
        osc2.frequency.value = FREQ[note] * 2;
        const g2 = ctx.createGain();
        g2.gain.value = 0.15;
        osc.connect(g);
        osc2.connect(g2).connect(g);
        g.connect(master);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.35) * 0.95);
        osc.start(t); osc2.start(t);
        osc.stop(t + Math.max(dur, 0.35)); osc2.stop(t + Math.max(dur, 0.35));
      }
      t += dur;
    }
    const msUntilNext = (t - ctx.currentTime - 0.4) * 1000;
    timerRef.current = setTimeout(() => scheduleLoop(ctx, master, t), Math.max(msUntilNext, 0));
  }, []);

  const stop = useCallback(() => {
    clearTimeout(timerRef.current);
    if (ctxRef.current) { ctxRef.current.close(); ctxRef.current = null; }
    setPlaying(false);
  }, []);

  const start = useCallback(() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0.12;
    master.connect(ctx.destination);
    ctxRef.current = ctx;
    scheduleLoop(ctx, master, ctx.currentTime + 0.1);
    setPlaying(true);
  }, [scheduleLoop]);

  useEffect(() => () => { clearTimeout(timerRef.current); ctxRef.current?.close(); }, []);

  return { playing, toggle: () => (playing ? stop() : start()) };
}

function Snowfall() {

      ))}
    </div>
  );
}

/* ---------------- New Year tree ---------------- */
const TIERS = [
  { top: 40, base: 150, w: 70 },
  { top: 95, base: 240, w: 100 },
  { top: 165, base: 335, w: 132 },
];
function halfWidth(y) {
  return Math.max(0, ...TIERS.map((t) => (y >= t.top && y <= t.base ? ((y - t.top) / (t.base - t.top)) * t.w : 0)));
}
const ORN_COLORS = ["#ef4444", "#fbbf24", "#38bdf8", "#a78bfa", "#f472b6", "#34d399"];
const SLOTS = (() => {
  const rows = [[2, 100], [3, 135], [4, 175], [5, 210], [5, 250], [5, 285], [6, 322]];
  const s = [];
  rows.forEach(([n, y]) => {
    const hw = halfWidth(y) * 0.78;
    for (let k = 0; k < n; k++) s.push({ x: 150 - hw + (2 * hw * (k + 0.5)) / n, y: y + (k % 2 ? 4 : -2) });
  });
  return s;
})();
const GARLANDS = [128, 200, 272, 318].map((y0, gi) => {
  const pts = [];
  const hw = halfWidth(y0) * 0.9;
  const count = 7 + gi * 2;
  for (let i = 0; i < count; i++) {
    const p = i / (count - 1);
    pts.push({ x: 150 - hw + 2 * hw * p, y: y0 + Math.sin(p * Math.PI) * 10 - 4 });
  }
  return pts;
});
const LIGHT_COLORS = ["#fde68a", "#fca5a5", "#93c5fd", "#86efac"];

function NewYearTree({ completed, lastAdded }) {
  const [hovered, setHovered] = useState(null);
  const tip = hovered ? (() => {
    const s = SLOTS[hovered - 1];
    const label = TOYS[hovered - 1].name;
    const w = label.length * 5.8 + 18;
    const x = Math.min(Math.max(s.x - w / 2, 4), 296 - w);
    return { x, y: s.y - 36, w, label };
  })() : null;
  return (
    <svg viewBox="0 0 300 380" className="mx-auto h-auto w-full max-w-xs overflow-visible" role="group" aria-label={`New Year tree with ${completed.length} of 30 toys`}>
      <defs>
        <linearGradient id="treeG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#15803d" />
          <stop offset="100%" stopColor="#14532d" />
        </linearGradient>
        <radialGradient id="shine" cx="35%" cy="35%" r="60%">
          <stop offset="0%" stopColor="#fff" stopOpacity=".8" />
          <stop offset="100%" stopColor="#fff" stopOpacity="0" />
        </radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#fbbf24" stopOpacity=".55" />
          <stop offset="100%" stopColor="#fbbf24" stopOpacity="0" />
        </radialGradient>
      </defs>
      <ellipse cx="150" cy="368" rx="120" ry="9" fill="#fff" opacity=".12" />
      <rect x="134" y="330" width="32" height="38" rx="4" fill="#78350f" />
      {[...TIERS].reverse().map((t, i) => (
        <path key={i} fill="url(#treeG)" stroke="#166534" strokeWidth="2"
          d={`M150 ${t.top} L${150 + t.w} ${t.base} Q${150 + t.w * 0.5} ${t.base + 12} 150 ${t.base - 2} Q${150 - t.w * 0.5} ${t.base + 12} ${150 - t.w} ${t.base} Z`} />
      ))}
      {GARLANDS.map((pts, gi) => (
        <g key={gi}>
          <polyline points={pts.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke="#fbbf24" strokeOpacity=".35" strokeWidth="1.5" />
          {pts.map((p, i) => (
            <circle key={i} cx={p.x} cy={p.y} r="2.6" fill={LIGHT_COLORS[(i + gi) % 4]} className="twinkle" style={{ animationDelay: `${((i * 0.37 + gi * 0.21) % 1.6).toFixed(2)}s` }} />
          ))}
        </g>
      ))}
      {SLOTS.map((s, i) => {
        const day = i + 1;
        const has = completed.includes(day);
        if (!has) return <circle key={i} cx={s.x} cy={s.y} r="7" fill="none" stroke="#bbf7d0" strokeOpacity=".25" strokeDasharray="2 2" />;
        const color = ORN_COLORS[i % ORN_COLORS.length];
        const toy = TOYS[i];
        return (
          <g key={`o${day}`} className={`cursor-pointer outline-none ${lastAdded === day ? "ornament-pop" : ""}`}
            tabIndex={0} role="img" aria-label={`Day ${day}: ${toy.name}`}
            onMouseEnter={() => setHovered(day)} onMouseLeave={() => setHovered(null)}
            onFocus={() => setHovered(day)} onBlur={() => setHovered(null)}>
            <line x1={s.x} y1={s.y - 14} x2={s.x} y2={s.y - 10} stroke="#fde68a" strokeWidth="1.2" />
            <circle cx={s.x} cy={s.y} r="10" fill={color} fillOpacity=".35" stroke={hovered === day ? "#fde68a" : color} strokeWidth={hovered === day ? 2 : 1} />
            <text x={s.x} y={s.y + 0.5} textAnchor="middle" dominantBaseline="central" fontSize="14" aria-hidden="true">{toy.emoji}</text>
          </g>
        );
      })}
      <circle cx="150" cy="34" r="30" fill="url(#halo)" />
      <polygon className="star-glow" fill="#fbbf24" stroke="#fde68a" strokeWidth="1.5"
        points="150,12 156,28 173,28 159,38 164,55 150,45 136,55 141,38 127,28 144,28" />
      {tip && (
        <g pointerEvents="none" aria-hidden="true">
          <rect x={tip.x} y={tip.y} width={tip.w} height="20" rx="10" fill="#0f172a" stroke="#fbbf24" strokeWidth="1" />
          <text x={tip.x + tip.w / 2} y={tip.y + 10.5} textAnchor="middle" dominantBaseline="central" fontSize="10.5" fontWeight="600" fill="#fde68a">{tip.label}</text>
        </g>
      )}
    </svg>
  );
}

/* ---------------- Mini-games ---------------- */
function ChoiceGame({ task, onResult, solved }) {
  const options = useMemo(() => shuffle(task.options), [task]);
  const [wrong, setWrong] = useState([]);
  const [picked, setPicked] = useState(null);
  const choose = (opt) => {
    if (solved) return;
    if (opt === task.answer) { setPicked(opt); onResult(true); }
    else { setWrong((w) => [...w, opt]); onResult(false); }
  };
  return (
    <div className="grid gap-2 sm:grid-cols-2">
      {options.map((opt) => {
        const isWrong = wrong.includes(opt);
        const isRight = picked === opt;
        return (
          <button key={opt} type="button" disabled={isWrong || solved} onClick={() => choose(opt)}
            className={`rounded-2xl px-4 py-3 text-left text-base font-semibold ring-2 transition focus:outline-none focus-visible:ring-amber-300 ${isRight ? "bg-emerald-500 text-white ring-emerald-300" : isWrong ? "bg-red-500/20 text-red-200 ring-red-400/40 line-through" : "bg-white/10 text-white ring-white/10 hover:-translate-y-0.5 hover:bg-white/20"}`}>
            {opt}
          </button>
        );
      })}
    </div>
  );
}

function TrueFalseGame({ task, onResult, solved }) {
  const [wrong, setWrong] = useState(null);
  const [right, setRight] = useState(null);
  const choose = (val) => {
    if (solved) return;
    if (val === task.answer) { setRight(val); onResult(true); }
    else { setWrong(val); onResult(false); }
  };
  return (
    <div className="grid grid-cols-2 gap-3">
      {[true, false].map((val) => (
        <button key={String(val)} type="button" disabled={solved || wrong === val} onClick={() => choose(val)}
          className={`rounded-2xl px-4 py-4 text-lg font-bold ring-2 transition focus:outline-none focus-visible:ring-amber-300 ${right === val ? "bg-emerald-500 text-white ring-emerald-300" : wrong === val ? "bg-red-500/20 text-red-200 ring-red-400/40" : val ? "bg-emerald-500/15 text-emerald-200 ring-emerald-400/30 hover:bg-emerald-500/25" : "bg-red-500/15 text-red-200 ring-red-400/30 hover:bg-red-500/25"}`}>
          {val ? "✔ True" : "✘ False"}
        </button>
      ))}
    </div>
  );
}

function UnscrambleGame({ task, onResult, solved }) {
  const byWord = task.answer.includes(" ");
  const pieces = useMemo(() => (byWord ? task.answer.split(" ") : task.answer.split("")), [task, byWord]);
  const tiles = useMemo(() => shuffleDifferent(pieces.map((p, i) => ({ id: i, text: p }))), [pieces]);
  const [placed, setPlaced] = useState([]);
  const [shake, setShake] = useState(false);
  const available = tiles.filter((t) => !placed.includes(t.id));
  const builtText = placed.map((id) => tiles.find((t) => t.id === id).text);

  const check = () => {
    const ok = builtText.join(byWord ? " " : "") === task.answer;
    if (!ok) { setShake(true); setTimeout(() => setShake(false), 400); }
    onResult(ok);
  };

  const tileCls = byWord
    ? "rounded-xl px-3 py-2 text-base font-semibold"
    : "flex h-11 w-11 items-center justify-center rounded-xl text-xl font-bold";

  return (
    <div className="space-y-4">
      <div className={`flex min-h-[3.75rem] flex-wrap items-center gap-2 rounded-2xl border-2 border-dashed p-2 ${solved ? "border-emerald-400 bg-emerald-500/10" : "border-amber-300/50 bg-slate-950/40"} ${shake ? "shake" : ""}`} aria-label="Your answer" aria-live="polite">
        {placed.length === 0 && <span className="px-2 text-sm text-slate-400">Tap the tiles below to build your answer…</span>}
        {placed.map((id) => {
          const t = tiles.find((x) => x.id === id);
          return (
            <button key={id} type="button" disabled={solved} onClick={() => setPlaced((p) => p.filter((x) => x !== id))}
              aria-label={`Remove ${t.text}`}
              className={`${tileCls} ${solved ? "bg-emerald-500 text-white" : "bg-amber-400 text-slate-900 hover:bg-amber-300"} transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white`}>
              {t.text}
            </button>
          );
        })}
      </div>
      {!solved && (
        <>
          <div className="flex flex-wrap gap-2">
            {available.map((t) => (
              <button key={t.id} type="button" onClick={() => setPlaced((p) => [...p, t.id])}
                className={`${tileCls} bg-white/10 text-white ring-1 ring-white/20 transition hover:-translate-y-0.5 hover:bg-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300`}>
                {t.text}
              </button>
            ))}
          </div>
          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={check} disabled={available.length > 0}
              className="inline-flex items-center gap-1.5 rounded-full bg-emerald-500 px-5 py-2 font-semibold text-white transition hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-40 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300">
              <Check className="h-4 w-4" aria-hidden="true" /> Check
            </button>
            <button type="button" onClick={() => setPlaced([])} disabled={placed.length === 0}
              className="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-4 py-2 font-semibold text-slate-200 transition hover:bg-white/20 disabled:opacity-40 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300">
              <Eraser className="h-4 w-4" aria-hidden="true" /> Clear
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function celebrate() {
  const colors = ["#fbbf24", "#ef4444", "#22c55e", "#38bdf8", "#f472b6", "#ffffff"];
  const opts = { zIndex: 100, colors, disableForReducedMotion: true };
  confetti({ ...opts, particleCount: 120, spread: 80, startVelocity: 45, origin: { y: 0.6 } });
  setTimeout(() => {
    confetti({ ...opts, particleCount: 60, angle: 60, spread: 60, origin: { x: 0, y: 0.7 } });
    confetti({ ...opts, particleCount: 60, angle: 120, spread: 60, origin: { x: 1, y: 0.7 } });
  }, 220);
}

/* ---------------- Task modal ---------------- */
function TaskModal({ day, level, alreadyDone: doneOnOpen, onClose, onComplete }) {
  const [alreadyDone] = useState(doneOnOpen);
  const info = DAYS[day - 1];
  const task = TASKS[level][day - 1];
  const [status, setStatus] = useState(alreadyDone ? "replay" : "idle");
  const [solved, setSolved] = useState(false);
  const praise = useMemo(() => PRAISE[Math.floor(Math.random() * PRAISE.length)], []);
  const closeRef = useRef(null);

  useEffect(() => {
    closeRef.current?.focus();
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); window.speechSynthesis?.cancel(); };
  }, [onClose]);

  const toy = TOYS[day - 1];
  const videoUrl = (task.videoUrl || "").trim();
  const isMp4 = /\.mp4(\?|#|$)/i.test(videoUrl);

  const handleResult = (ok) => {
    if (ok) { setSolved(true); setStatus("correct"); onComplete(day); celebrate(); }
    else setStatus("wrong");
  };

  const listenText = task.type === "unscramble" ? task.prompt
    : task.type === "true_false" ? `True or false? ${task.prompt}`
    : `${task.prompt} ${task.options.join(", ")}`;

  const Game = task.type === "unscramble" ? UnscrambleGame : task.type === "true_false" ? TrueFalseGame : ChoiceGame;

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/70 p-0 backdrop-blur-sm sm:items-center sm:p-4" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div role="dialog" aria-modal="true" aria-labelledby="task-title" className="fade-in relative max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-gradient-to-b from-indigo-950 to-slate-900 p-6 shadow-2xl ring-1 ring-amber-300/30 sm:rounded-3xl">
        <button ref={closeRef} type="button" onClick={onClose} aria-label="Close"
          className="absolute right-4 top-4 rounded-full p-2 text-slate-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300">
          <X className="h-5 w-5" aria-hidden="true" />
        </button>

        <div className="flex items-center gap-4">
          <div className="flex h-20 w-20 shrink-0 items-center justify-center rounded-3xl bg-white/5 text-5xl ring-1 ring-white/10" aria-hidden="true">{info.emoji}</div>
          <div>
            <p className="text-xs font-semibold uppercase tracking-widest text-amber-300">December {day} · {info.theme}</p>
            <h2 id="task-title" className="font-display text-2xl font-bold text-white">{TYPE_LABEL[task.type]}</h2>
            {alreadyDone && <p className="mt-1 inline-flex items-center gap-1 text-xs font-semibold text-emerald-300"><Check className="h-3.5 w-3.5" aria-hidden="true" /> Already completed — play again!</p>}
          </div>
        </div>

        <p className="mt-5 text-lg font-medium leading-relaxed text-indigo-50">{task.prompt}</p>

        <div className="mt-3 flex flex-wrap gap-2">
          <button type="button" onClick={() => speak(listenText)}
            className="inline-flex items-center gap-1.5 rounded-full bg-sky-500/20 px-4 py-1.5 text-sm font-semibold text-sky-200 ring-1 ring-sky-400/40 transition hover:bg-sky-500/30 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300">
            <Volume2 className="h-4 w-4" aria-hidden="true" /> Listen
          </button>
          {videoUrl && !isMp4 && (
            <a href={videoUrl} target="_blank" rel="noopener noreferrer"
              className="inline-flex items-center gap-1.5 rounded-full bg-red-500/20 px-4 py-1.5 text-sm font-semibold text-red-200 ring-1 ring-red-400/40 transition hover:bg-red-500/30 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300">
              <Film className="h-4 w-4" aria-hidden="true" /> Watch in Movies
              <span className="sr-only">(opens in a new tab)</span>
            </a>
          )}
        </div>

        {videoUrl && isMp4 && (
          <figure className="mt-4 overflow-hidden rounded-2xl bg-black ring-1 ring-white/10">
            <video src={videoUrl} controls playsInline preload="metadata" className="aspect-video w-full bg-black" aria-label={`Movie clip for December ${day}`} />
            <figcaption className="flex items-center gap-1.5 bg-slate-950/80 px-3 py-2 text-xs font-semibold text-red-200">
              <Film className="h-3.5 w-3.5" aria-hidden="true" /> Watch in Movies
            </figcaption>
          </figure>
        )}

        <div className="mt-5">
          <Game task={task} onResult={handleResult} solved={solved} />
        </div>

        <div aria-live="polite" className="mt-4">
          {status === "wrong" && <p className="rounded-2xl bg-red-500/15 px-4 py-2 text-sm font-semibold text-red-200">Not quite — try again! 💪</p>}
          {status === "correct" && (
            <div className="fade-in space-y-3 rounded-2xl bg-emerald-500/15 p-4 ring-1 ring-emerald-400/40">
              <p className="flex items-center gap-2 font-display text-xl font-bold text-emerald-200"><Sparkles className="h-5 w-5" aria-hidden="true" /> {praise}</p>
              <div className="reward-in flex items-center gap-4 rounded-2xl bg-gradient-to-br from-amber-300 via-amber-400 to-orange-400 p-4 text-slate-900 shadow-lg shadow-amber-500/30">
                <span className="toy-bounce text-6xl leading-none drop-shadow" aria-hidden="true">{toy.emoji}</span>
                <div>
                  <p className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-widest text-red-700">
                    <Gift className="h-4 w-4" aria-hidden="true" /> {alreadyDone ? "Toy in your collection" : "New Toy Unlocked!"}
                  </p>
                  <p className="mt-1 font-display text-xl font-bold leading-tight">You won: {toy.name}!</p>
                </div>
              </div>
              <div className="rounded-xl bg-slate-950/40 p-3">
                <p className="flex items-center gap-1.5 text-sm font-bold text-amber-300"><Lightbulb className="h-4 w-4" aria-hidden="true" /> Did you know?</p>
                <p className="mt-1 text-sm leading-relaxed text-indigo-50">{info.fact}</p>
              </div>
              <p className="text-sm font-semibold text-emerald-100">{alreadyDone ? `Your ${toy.name} is already shining on the tree!` : `Your ${toy.name} has been hung on your New Year tree!`}</p>
              <button type="button" onClick={onClose}
                className="w-full rounded-full bg-amber-400 px-5 py-2.5 font-bold text-slate-900 transition hover:bg-amber-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
                Back to the Calendar
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- PIN modal ---------------- */
function PinModal({ onClose, onSuccess }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const inputRef = useRef(null);
  useEffect(() => {
    inputRef.current?.focus();
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  const submit = () => {
    if (pin.trim() === TEACHER_PIN) onSuccess();
    else { setError(true); setPin(""); inputRef.current?.focus(); }
  };
  const onInputKeyDown = (e) => {
    if (e.key !== "Enter" || e.nativeEvent.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    submit();
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div role="dialog" aria-modal="true" aria-labelledby="pin-title" className="fade-in w-full max-w-sm rounded-3xl bg-slate-900 p-6 ring-1 ring-white/10">
        <h2 id="pin-title" className="flex items-center gap-2 font-display text-xl font-bold"><Lock className="h-5 w-5 text-amber-300" aria-hidden="true" /> Teacher Mode</h2>
        <label htmlFor="pin" className="mt-3 block text-sm text-slate-300">Enter the teacher PIN to unlock all doors.</label>
        <input id="pin" ref={inputRef} type="password" inputMode="numeric" autoComplete="off" maxLength={8} value={pin}
          onChange={(e) => { setPin(e.target.value); setError(false); }} onKeyDown={onInputKeyDown}
          className="mt-2 w-full rounded-xl bg-slate-950 px-4 py-3 text-center text-2xl tracking-[0.5em] text-white ring-1 ring-white/15 focus:outline-none focus:ring-2 focus:ring-amber-300" aria-invalid={error} aria-describedby={error ? "pin-error" : undefined} />
        {error && <p id="pin-error" className="mt-2 text-sm font-semibold text-red-300">Wrong PIN. Please try again.</p>}
        <div className="mt-4 flex gap-2">
          <button type="button" onClick={onClose} className="flex-1 rounded-full bg-white/10 px-4 py-2 font-semibold hover:bg-white/20">Cancel</button>
          <button type="button" onClick={submit} className="flex-1 rounded-full bg-amber-400 px-4 py-2 font-bold text-slate-900 hover:bg-amber-300">Unlock</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [level, setLevel] = useState("A1");
  const [progress, setProgress] = useState(() => Object.fromEntries(LEVELS.map((l) => [l.id, loadProgress(l.id)])));
  const [teacher, setTeacher] = useState(false);
  const [pinOpen, setPinOpen] = useState(false);
  const [openDay, setOpenDay] = useState(null);
  const [lastAdded, setLastAdded] = useState(null);
  const [toast, setToast] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const music = useJingleBells();
  const cal = useMemo(getCalendarInfo, []);
  const toastTimer = useRef(null);

  const completed = progress[level];
  const isUnlocked = (day) => teacher || day <= cal.openUpTo;

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  };

  const openDoor = (day) => {
    if (!isUnlocked(day) && !completed.includes(day)) {
      showToast(`🔒 Door ${day} opens on December ${day}. Come back then!`);
      return;
    }
    setOpenDay(day);
  };

  const completeDay = (day) => {
    setProgress((prev) => {
      if (prev[level].includes(day)) return prev;
      const next = [...prev[level], day].sort((a, b) => a - b);
      saveProgress(level, next);
      return { ...prev, [level]: next };
    });
    setLastAdded(day);
  };

  const resetLevel = () => {
    if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 3500); return; }
    saveProgress(level, []);
    setProgress((prev) => ({ ...prev, [level]: [] }));
    setConfirmReset(false);
    showToast(`Progress for ${level} has been reset.`);
  };

  const closeModal = useCallback(() => setOpenDay(null), []);
  const closePin = useCallback(() => setPinOpen(false), []);
  const levelLabel = LEVELS.find((l) => l.id === level).label;

  return (
    <div className="relative min-h-screen">
      <Snowfall />
      <Header stars={completed.length} music={music} />

      {teacher && (
        <div role="status" className="relative z-10 flex items-center justify-center gap-2 bg-emerald-600 px-4 py-2 text-sm font-semibold text-white">
          <ShieldCheck className="h-4 w-4" aria-hidden="true" /> Teacher Preview Mode Active — all 30 doors are unlocked
        </div>
      )}

      <main className="relative z-10 mx-auto max-w-7xl px-4 py-8">
        <div className="text-center">
          <p className="text-sm font-semibold uppercase tracking-[0.25em] text-amber-300">30-Day English Advent Calendar</p>
          <h1 className="mt-2 text-balance font-display text-4xl font-bold leading-tight text-white sm:text-5xl">
            Winter & New Year <span className="text-red-400">Around the World</span>
          </h1>
          <p className="mx-auto mt-3 max-w-2xl text-pretty text-indigo-200">
            Open a door every day from December 1 to December 30, solve the mini-game, and decorate your New Year tree with a shiny ornament!
          </p>
        </div>

        <div className="mt-6 flex justify-center">
          <LevelTabs level={level} onChange={(l) => { setLevel(l); setLastAdded(null); }} progressByLevel={progress} />
        </div>

        {!teacher && cal.daysUntil > 0 && (
          <p className="mx-auto mt-5 max-w-xl rounded-2xl bg-white/5 px-4 py-2 text-center text-sm text-indigo-100 ring-1 ring-white/10">
            ❄️ The calendar opens on <strong className="text-amber-300">December 1</strong> — {cal.daysUntil} {cal.daysUntil === 1 ? "day" : "days"} to go!
          </p>
        )}

        <div className="mt-8 grid gap-8 lg:grid-cols-[1fr_340px]">
          <section aria-labelledby="calendar-heading" className="rounded-3xl bg-slate-950/30 p-4 ring-1 ring-white/10 sm:p-6">
            <h2 id="calendar-heading" className="sr-only">Advent calendar doors for {levelLabel}</h2>
            <AdventGrid completed={completed} isUnlocked={isUnlocked} todayDay={cal.today} onOpen={openDoor} />
            <div className="mt-5 flex flex-wrap items-center justify-center gap-4 text-xs text-indigo-200">
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded bg-red-600 ring-1 ring-amber-300" aria-hidden="true" /> Open</span>
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded bg-emerald-600" aria-hidden="true" /> Completed</span>
              <span className="flex items-center gap-1.5"><span className="h-3 w-3 rounded bg-slate-700" aria-hidden="true" /> Locked</span>
            </div>
          </section>

          <aside aria-labelledby="tree-heading" className="rounded-3xl bg-slate-950/30 p-5 ring-1 ring-white/10 lg:sticky lg:top-6 lg:self-start">
            <h2 id="tree-heading" className="text-center font-display text-xl font-bold text-white">Your New Year Tree 🎄</h2>
            <p className="mt-1 text-center text-sm text-indigo-200">{completed.length === 30 ? "Your tree is complete! Happy New Year! 🎉" : `${30 - completed.length} toys left to collect`}</p>
            <div className="mt-4"><NewYearTree completed={completed} lastAdded={lastAdded} /></div>
            <div className="mt-4 h-3 overflow-hidden rounded-full bg-white/10" role="progressbar" aria-valuemin={0} aria-valuemax={30} aria-valuenow={completed.length} aria-label="Toys collected">
              <div className="h-full rounded-full bg-gradient-to-r from-amber-400 to-red-500 transition-all duration-700" style={{ width: `${(completed.length / 30) * 100}%` }} />
            </div>
            <ToyCollection completed={completed} lastAdded={lastAdded} />
          </aside>
        </div>
      </main>

      <footer className="relative z-10 border-t border-white/10 bg-slate-950/40">
        <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-4">
          <p className="text-xs text-indigo-300">Progress is saved separately for each level on this device.</p>
          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={() => (teacher ? setTeacher(false) : setPinOpen(true))} aria-pressed={teacher}
              className={`inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold ring-1 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300 ${teacher ? "bg-emerald-600 text-white ring-emerald-400" : "bg-white/5 text-slate-200 ring-white/15 hover:bg-white/10"}`}>
              {teacher ? "🔓 Teacher Mode: ON" : "🔒 Teacher Mode: OFF"}
            </button>
            <button type="button" onClick={resetLevel}
              className={`inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold ring-1 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300 ${confirmReset ? "bg-red-600 text-white ring-red-400" : "bg-white/5 text-slate-200 ring-white/15 hover:bg-white/10"}`}>
              <RotateCcw className="h-4 w-4" aria-hidden="true" /> {confirmReset ? `Click again to reset ${level}` : "Reset Level Progress"}
            </button>
          </div>
        </div>
      </footer>

      {toast && (
        <div role="status" className="fade-in fixed bottom-6 left-1/2 z-40 -translate-x-1/2 rounded-full bg-slate-800 px-5 py-2.5 text-sm font-semibold text-white shadow-xl ring-1 ring-white/15">
          {toast}
        </div>
      )}

      {openDay && (
        <TaskModal key={`${level}-${openDay}`} day={openDay} level={level} alreadyDone={completed.includes(openDay)} onClose={closeModal} onComplete={completeDay} />
      )}
      {pinOpen && <PinModal onClose={closePin} onSuccess={() => { setTeacher(true); setPinOpen(false); showToast("✅ Teacher Mode unlocked!"); }} />}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
